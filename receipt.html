<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  /* ====== 폰트 ====== */
  @import url('//fonts.googleapis.com/earlyaccess/notosanskr.css');

  @font-face {
      font-family: 'KccAnchangho';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/KCC-Ahnchangho.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background:#f0f0e8;
    padding:40px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .receipt {
    position: relative;
    width:320px;
    background:#fff;
    border:4px solid #3c6b4f;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    margin-left:20px;
  }

  .receipt::before,
  .receipt::after {
    content:'';
    position:absolute;
    left:50%;
    width:80%;
    height:20px;
    background:#f0f0e8;
    border-top:4px solid #3c6b4f;
    border-bottom:4px solid #3c6b4f;
    border-radius:20px;
    transform:translateX(-50%);
    z-index:1;
  }
  .receipt::before { top:-12px; }
  .receipt::after  { bottom:-12px; }

  .content {
    padding:30px 20px 20px 20px;
    position:relative;
    z-index:2;
  }

  /* Receipt 전용 폰트/굵기 */
  h1 {
    text-align:center;
    color:#3c6b4f;
    margin-bottom:8px;
    font-family: 'KccAnchangho', cursive;
    font-weight: bold;
    font-size: 1.8em;
  }

  table { width:100%; margin-top:10px; border-collapse: collapse;}
  td, th { text-align:center; padding:4px 0; }

  /* 헤더 위·아래, 마지막 줄 굵은 실선 */
  table thead tr:first-child th {
    border-top:2px solid #3c6b4f;
    border-bottom:2px solid #3c6b4f;
  }
  table tbody tr:last-child td {
    border-bottom:2px solid #3c6b4f;
  }

  .total { margin-top:20px; text-align:right; font-weight:bold; color:#3c6b4f; }

  .form-controls {
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    margin-bottom:20px;
    font-weight:500;
  }
  .form-controls label { margin-top:8px; }
  .form-controls input {
    margin-top:4px;
    margin-bottom:12px;
    width: 200px;
    padding:6px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .form-controls button {
    margin:6px 4px 0 0;
    padding:6px 12px;
    font-family: 'Noto Sans KR', sans-serif;
    background:#3c6b4f;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .form-controls button:hover { background:#2f543d; }

  .date-separator td {
    border-top:1px dashed rgba(60,107,79,0.4);
    height:6px;
    padding:0;
  }

  #preview {
    margin-top:40px;
    text-align:center;
  }
  #preview img {
    border:1px solid #ccc;
    max-width:320px;
    height:auto;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<div style="display:flex;align-items:flex-start;">
  <div class="form-controls">
    <label>날짜</label>
    <input id="date" type="text" placeholder="00.00.00">

    <label>내용</label>
    <input id="item" type="text" placeholder="어디에 썼나요?">

    <label>금액</label>
    <input id="count" type="number" placeholder="얼마 썼나요?">

    <div>
      <button onclick="addItem()">추가</button>
      <button onclick="downloadImage()">이미지로 저장</button>
    </div>
  </div>

  <div id="receipt" class="receipt">
    <div class="content">
      <h1>* Receipt *</h1>
      <table id="listTable">
        <thead>
          <tr><th>날짜</th><th>내용</th><th>금액</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <p class="total">합계 <span id="total">0</span></p>
    </div>
  </div>
</div>

<div id="preview"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
let total = 0;
let entries = [];

function addItem(){
  const date  = document.getElementById('date').value.trim();
  const item  = document.getElementById('item').value.trim();
  const count = parseInt(document.getElementById('count').value,10);

  if(!date || !item || !count){
    alert("날짜·내용·금액을 모두 입력하세요");
    return;
  }

  entries.push({date, item, count});
  total += count;

  entries.sort((a,b) => a.date.localeCompare(b.date));
  renderTable();
}

function renderTable(){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  let lastDate = "";
  entries.forEach(e => {
    if(lastDate && lastDate !== e.date){
      const sep = document.createElement('tr');
      sep.className = 'date-separator';
      sep.innerHTML = '<td colspan="3"></td>';
      tbody.appendChild(sep);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.date}</td><td>${e.item}</td><td>${e.count}</td>`;
    tbody.appendChild(tr);
    lastDate = e.date;
  });

  document.getElementById('total').textContent = total;
}

function downloadImage(){
  const receipt = document.getElementById("receipt");
  html2canvas(receipt, {
    backgroundColor: '#ffffff',   // ✅ 흰색 배경 강제
    useCORS: true
  }).then(canvas => {
    // ✅ JPEG 로 저장
    const link = document.createElement('a');
    link.download = 'receipt.jpg';
    link.href = canvas.toDataURL("image/jpeg", 1.0); // 최대 품질 JPEG
    link.click();

    // ✅ 미리보기도 JPEG 로 표시
    const preview = document.getElementById('preview');
    preview.innerHTML = "<h3>저장된 이미지 미리보기</h3>";
    const img = document.createElement('img');
    img.src = canvas.toDataURL("image/jpeg", 1.0);
    preview.appendChild(img);
  });
}
</script>

</body>
</html>
