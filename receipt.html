<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  /* ====== 폰트 ====== */
  @import url('//fonts.googleapis.com/earlyaccess/notosanskr.css');

  @font-face {
      font-family: 'KccAnchangho';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_1@1.0/KCC-Ahnchangho.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
  }

  /* ✅ 하단 문구 전용 폰트 */
  @font-face {
      font-family: 'GangwonEducationSaeum';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduSaeeum_OTFMediumA.woff') format('woff');
      font-weight: normal;
      font-display: swap;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background:#f0f0e8;
    padding:40px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

/* ===== 레이아웃 ===== */
.container{
  display:flex;
  align-items:flex-start;
  gap:20px;
  /* 💡 가운데 정렬 */
  justify-content:center;
  flex-wrap:wrap; /* 넓으면 가로, 좁으면 자동 줄바꿈 */
}

/* 💡 화면 너비가 1000px 미만이면 세로 배치 */
@media (max-width: 1000px){
  .container{
    flex-direction:column;
    align-items:center;
  }
}


  .receipt {
    position: relative;
    width:320px;
    background:#fff;
    border:4px solid #3c6b4f;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }

  .receipt::before,
  .receipt::after {
    content:'';
    position:absolute;
    left:50%;
    width:80%;
    height:20px;
    background:#f0f0e8;
    border-top:4px solid #3c6b4f;
    border-bottom:4px solid #3c6b4f;
    border-radius:20px;
    transform:translateX(-50%);
    z-index:1;
  }
  .receipt::before { top:-12px; }
  .receipt::after  { bottom:-12px; }

  .content {
    padding:30px 20px 20px 20px;
    position:relative;
    z-index:2;
  }

  /* Receipt 전용 폰트/굵기 */
  h1 {
    text-align:center;
    color:#3c6b4f;
    margin-bottom:8px;
    font-family: 'KccAnchangho', cursive;
    font-weight: bold;
    font-size: 2em;
  }

  table {
    width:100%;
    margin-top:10px;
    border-collapse: collapse;
    border-spacing: 0;       /* ✅ 셀 간 간격 통일 */
  }
  th, td {
    text-align:center;
    padding:4px 0;
  }
  th {
    border-top:2px solid #3c6b4f;
    border-bottom:2px solid #3c6b4f;
  }
  tbody tr:last-child td {
    border-bottom:2px solid #3c6b4f;
  }

  /* ✅ 본문 데이터(테이블 바디) */
  tbody td { font-size: 0.8em; }

  /* ✅ 날짜 구분선 : 일반 행과 동일한 간격 */
  .date-separator td {
    padding:0;
    border-top:1px dashed rgba(60,107,79,0.6);
  }

  .total {
    margin-top:20px;
    text-align:right;
    font-weight:bold;
    color:#3c6b4f;
  }

  /* ✅ 하단 문구 스타일 */
  .bottom-msg {
    text-align:center;
    color:#3c6b4f;
    font-family: 'GangwonEducationSaeum', cursive;
    font-size: 1.1em;
    margin-top: 6px;
  }

  .form-controls {
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    font-weight:500;
  }
  .form-controls label { margin-top:8px; }
  .form-controls input {
    margin-top:4px;
    margin-bottom:12px;
    width: 200px;
    padding:6px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .form-controls button {
    margin:6px 4px 0 0;
    padding:6px 12px;
    font-family: 'Noto Sans KR', sans-serif;
    background:#3c6b4f;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .form-controls button:hover { background:#2f543d; }

  .delete-btn{
    background:#d9534f;
    color:#fff;
    border:none;
    border-radius:4px;
    padding:2px 6px;
    cursor:pointer;
    font-size:0.8em;
  }
  .delete-btn:hover{background:#c9302c;}
</style>
</head>
<body>

<div class="container">
  <div class="form-controls">
    <label>날짜</label>
    <input id="date" type="text" placeholder="00.00.00">

    <label>내용</label>
    <input id="item" type="text" placeholder="어디에 썼나요?">

    <label>금액</label>
    <input id="count" type="number" placeholder="얼마 썼나요?">

    <div>
      <button onclick="addItem()">추가</button>
      <button onclick="downloadImage()">이미지로 저장</button>
    </div>
  </div>

  <div id="receipt" class="receipt">
    <div class="content">
      <h1>[ Receipt ]</h1>
      <table id="listTable">
        <thead>
          <tr><th>날짜</th><th>내용</th><th>금액</th><th>삭제</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <p class="total">합계 <span id="total">0</span></p>
      <p class="bottom-msg">** 불필요한 소비를 줄이자-! **</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
let total = 0;
let entries = [];

function addItem(){
  const date  = document.getElementById('date').value.trim();
  const item  = document.getElementById('item').value.trim();
  const countValue = document.getElementById('count').value.trim();
  const count = parseInt(countValue,10);

  // ✅ 금액이 비어있거나 숫자가 아닐 때만 경고 (0도 허용)
  if(!date || !item || countValue === '' || isNaN(count)){
    alert("날짜·내용·금액을 모두 입력하세요");
    return;
  }

  const id = Date.now(); // 고유 ID
  entries.push({id, date, item, count});
  renderTable();
}

function renderTable(){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  // 합계 다시 계산
  total = 0;
  entries.sort((a,b) => a.date.localeCompare(b.date));
  let lastDate = "";

  entries.forEach(e => {
    if(lastDate && lastDate !== e.date){
      const sep = document.createElement('tr');
      sep.className = 'date-separator';
      sep.innerHTML = '<td colspan="4"></td>';
      tbody.appendChild(sep);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${e.date}</td>
      <td>${e.item}</td>
      <td>${e.count.toLocaleString()}</td>  <!-- ✅ 1,000단위 콤마 -->
      <td><button class="delete-btn" onclick="deleteItem(${e.id})">삭제</button></td>`;
    tbody.appendChild(tr);
    total += e.count;
    lastDate = e.date;
  });

  // ✅ 합계에도 콤마 표시
  document.getElementById('total').textContent = total.toLocaleString();
}

function deleteItem(id){
  entries = entries.filter(e => e.id !== id);
  renderTable();
}

function downloadImage(){
  const receipt = document.getElementById("receipt");

  // ✅ “삭제” 열(헤더 + 각 행) 전체 숨기기
  const delHeader = document.querySelector('th:last-child');
  const delCells  = document.querySelectorAll('td:last-child');
  if(delHeader) delHeader.style.display = 'none';
  delCells.forEach(td => td.style.display = 'none');

  html2canvas(receipt, {
    backgroundColor: '#ffffff',
    useCORS: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'receipt.png';                // ✅ PNG로 저장
    link.href = canvas.toDataURL("image/png");    // ✅ PNG
    link.click();

    // ✅ 캡처 끝난 뒤 다시 표시
    if(delHeader) delHeader.style.display = '';
    delCells.forEach(td => td.style.display = '');
  });
}
</script>

</body>
</html>
